<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 小游戏画廊</title>
<meta name="description" content="由 4 个 AI 员工接力制作、经人工试玩与批准后上线的竖屏小游戏。">
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --text: #1d1c1a; --muted: #6b6862;
    --line: #e4e1da; --accent: #2f6ff3; --accent-text: #ffffff; --tag: #eef2fe; --tag-text: #1f4fb8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414; --surface: #1e1e1e; --text: #f1efe8; --muted: #a8a59d;
      --line: #2e2e2c; --accent: #5b8cff; --accent-text: #0b1530; --tag: #1d2740; --tag-text: #b9cbff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    line-height: 1.6;
  }
  header { max-width: 1080px; margin: 0 auto; padding: 40px 16px 8px; }
  h1 { margin: 0 0 6px; font-size: 28px; font-weight: 600; letter-spacing: 0.5px; }
  header p { margin: 0; color: var(--muted); font-size: 15px; }
  main {
    max-width: 1080px; margin: 0 auto; padding: 24px 16px 56px;
    display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .media { position: relative; aspect-ratio: 9 / 16; background: #000; max-height: 460px; }
  .media video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .issue {
    position: absolute; top: 12px; left: 12px; padding: 2px 10px; border-radius: 999px;
    background: rgba(0, 0, 0, 0.55); color: #fff; font-size: 12px;
  }
  .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .body h2 { margin: 0; font-size: 20px; font-weight: 600; }
  .tagline { margin: 0; font-size: 15px; }
  .how { margin: 0; color: var(--muted); font-size: 13px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span { background: var(--tag); color: var(--tag-text); border-radius: 999px; padding: 1px 10px; font-size: 12px; }
  .play {
    margin-top: auto; display: block; text-align: center; text-decoration: none;
    background: var(--accent); color: var(--accent-text); border-radius: 12px;
    padding: 12px 16px; font-size: 16px; font-weight: 600;
  }
  .play:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  .empty { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 64px 16px; border: 1px dashed var(--line); border-radius: 18px; }
  footer { max-width: 1080px; margin: 0 auto; padding: 0 16px 40px; color: var(--muted); font-size: 12px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<header>
  <h1>AI 小游戏画廊</h1>
  <p>每款游戏都由 4 个 AI 员工接力完成：策划、制作、营销、打包，再经人工试玩与批准后上线。手机竖屏体验最佳。</p>
</header>
<main id="gallery" aria-live="polite">
  <div class="empty">正在加载……</div>
</main>
<footer>
  流程说明见 <a href="https://github.com/longsnow65-droid/mini_games/tree/main/factory">factory/</a>。
</footer>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const gallery = document.getElementById("gallery");
  fetch("games.json", { cache: "no-store" })
    .then((r) => (r.ok ? r.json() : []))
    .catch(() => [])
    .then((games) => {
      if (!games.length) {
        gallery.innerHTML = '<div class="empty">第一款游戏正在生产线上，敬请期待。</div>';
        return;
      }
      gallery.innerHTML = games.map((g) => `
        <article class="card">
          <div class="media">
            <video src="${esc(g.video)}" poster="${esc(g.cover)}" muted loop playsinline autoplay preload="metadata"
                   aria-label="${esc(g.title)} 演示视频"></video>
            <span class="issue">第 ${esc(g.issue)} 期</span>
          </div>
          <div class="body">
            <h2>${esc(g.title)}</h2>
            <p class="tagline">${esc(g.tagline)}</p>
            <p class="how">${esc(g.how_to_play)}</p>
            <div class="tags">${(g.tags || []).map((t) => `<span>${esc(t)}</span>`).join("")}</div>
            <a class="play" href="${esc(g.url)}">开始玩</a>
          </div>
        </article>`).join("");
    });
</script>
</body>
</html>
